name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # material.dart est marqué obsolète depuis Flutter 3.47 (simple info) : il reste nécessaire pour les versions plus anciennes.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
